[project]
name = "chatgpt-proxy-backend"
version = "0.1.0"
description = "Privacy-first medical LLM gateway backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "cryptography>=43,<44",
    "presidio-analyzer>=2.2,<3",
    "spacy>=3.8,<3.9",
    "rdflib>=7.1,<8",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "import-linter>=2.1,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Privacy gateway must not import API or LLM gateway layers"
type = "forbidden"
source_modules = ["app.privacy_gateway"]
forbidden_modules = ["app.api", "app.llm_gateway"]

[[tool.importlinter.contracts]]
name = "Privacy gateway must not be network-capable"
type = "forbidden"
source_modules = ["app.privacy_gateway"]
forbidden_modules = ["httpx", "requests", "aiohttp", "urllib3", "socket", "urllib", "http", "ftplib", "smtplib", "telnetlib"]
