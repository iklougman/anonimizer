name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatgpt_proxy
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: chatgpt_proxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatgpt_proxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://chatgpt_proxy:change-me@localhost:5432/chatgpt_proxy
      MASTER_KEY_PATH: /tmp/ci-master.key
      APP_RUNTIME_PASSWORD: change-me-app-runtime
      # Required since Settings.app_ops_password became a mandatory field
      # (migration 0007 provisions the app_ops Postgres role with it) --
      # this job's env block was never updated to match, so `alembic
      # upgrade head` has been failing on every run with a pydantic
      # ValidationError since that change landed.
      APP_OPS_PASSWORD: change-me-app-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m spacy download de_core_news_lg
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: backend/app/privacy_gateway/risk_scoring/data
          key: reference-data-v1
      - run: python scripts/fetch_reference_data.py
      - run: head -c 32 /dev/urandom > /tmp/ci-master.key
      - run: ruff check .
      - run: lint-imports
      - run: alembic upgrade head
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30.0.1 (package-lock.json) declares
          # engines.node: "^22.22.2 || ^24.15.0 || >=26.0.0" -- Node 20
          # (this job's prior pin) isn't in that range at all, so `npm
          # test` (vitest, which loads jsdom) has been failing on every
          # run with "webidl.util.markAsUncloneable is not a function"
          # since jsdom was bumped to 30.x.
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Configure for CI (stub LLM provider, test environment, host-side Keycloak admin access)
        run: |
          sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=test/' .env
          echo "LLM_PROVIDER=stub" >> .env
          # UVICORN_WORKERS defaults to 4 (docker-compose.yml), sized for a
          # real deployment host. Each worker is a separate process that
          # loads its own full copy of the German spaCy model -- 4 of them
          # under the backend service's 2g memory limit (docker-compose.yml)
          # OOM-crash-loops the workers (confirmed: "Started server
          # process"/"Child process died" cycling with no Python traceback
          # in `docker compose logs`, consistent with SIGKILL). A throwaway
          # e2e stack handling a handful of test requests needs none of that
          # parallelism -- one worker is what every local verification run
          # of this suite has used all along (docker-compose.override.yml's
          # dev command implies a single worker via --reload).
          echo "UVICORN_WORKERS=1" >> .env
          # keycloak/realm-export.json ships a fixed, non-secret dev credential
          # for the confidential chatgpt-proxy-backend-admin service-account
          # client. .env.example leaves this blank so a real deployment must
          # set a real secret, but CI (like local dev) imports the same fixed
          # realm-export.json, so this fixed value is correct here, not a
          # leaked credential. Needed by both the backend container itself
          # (Task 8's admin-user-creation spec exercises POST /api/admin/users,
          # which calls the Keycloak admin API) and the host-side provisioning
          # script below.
          echo "KEYCLOAK_ADMIN_CLIENT_SECRET=dev-backend-admin-secret" >> .env
          # docker-compose.yml hardcodes the *backend container's* admin-API
          # base URL to http://keycloak:8080 (container-network DNS) directly
          # in its environment block -- unaffected by this value. This one is
          # only for host-side processes: global-setup.ts/global-teardown.ts
          # spawn backend/scripts/provision_e2e_tenant.py natively on the
          # runner (not inside a container), which reaches Keycloak through
          # its published host port instead.
          echo "KEYCLOAK_ADMIN_BASE_URL=http://localhost:8080" >> .env
      - run: mkdir -p secrets && head -c 32 /dev/urandom > secrets/master.key
      - name: Bring up the stack (omitting ollama and traefik)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build postgres keycloak backend ops_admin frontend
      - name: Wait for stack health
        run: ./e2e/scripts/wait-for-health.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend/.[dev]
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          # NEXTAUTH_SECRET deliberately NOT set here: playwright.config.ts's
          # dotenv.config() already loads the repo-root .env (the same file
          # `docker compose up` above used for variable substitution into the
          # frontend container), so support/session.ts's injectSession() and
          # the running frontend container are guaranteed to sign/verify
          # against the same secret without duplicating it in this workflow.
          DATABASE_URL: postgresql+psycopg://chatgpt_proxy:change-me@localhost:5432/chatgpt_proxy
          MASTER_KEY_PATH: ${{ github.workspace }}/secrets/master.key
          KEYCLOAK_ISSUER: http://localhost:8080/realms/chatgpt-proxy-dev
          E2E_BASE_URL: http://localhost:3000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
