name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatgpt_proxy
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: chatgpt_proxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatgpt_proxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://chatgpt_proxy:change-me@localhost:5432/chatgpt_proxy
      MASTER_KEY_PATH: /tmp/ci-master.key
      APP_RUNTIME_PASSWORD: change-me-app-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m spacy download de_core_news_lg
      - name: Cache reference data
        uses: actions/cache@v4
        with:
          path: backend/app/privacy_gateway/risk_scoring/data
          key: reference-data-v1
      - run: python scripts/fetch_reference_data.py
      - run: head -c 32 /dev/urandom > /tmp/ci-master.key
      - run: ruff check .
      - run: lint-imports
      - run: alembic upgrade head
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
